<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список справ - Firebase</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>Список справ</h1>
      <p class="subtitle">Практична робота: CRUD + Firebase Realtime Database</p>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="Введіть нову справу..." autocomplete="off" />
        <button type="submit">Додати</button>
      </form>

      <div class="stats">
        <span>Усього: <b id="item-count">0</b></span>
        <span>Невиконано: <b id="unchecked-count">0</b></span>
      </div>

      <p id="loading" class="message hidden">Завантаження даних...</p>
      <p id="error" class="message error hidden"></p>

      <ul id="todo-list" class="todo-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
